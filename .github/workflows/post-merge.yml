name: Post-merge

# Two questions, in order, and they are not the same question.
#
#   verify   is main shippable right now?
#   promote  does this version go to production?
#
# REQ-3 is enforced here rather than in the service. `promote` carries
# `needs: verify`, so when verification fails GitHub skips promotion, the
# previously promoted release stays the current one, and production does not get
# the change (REQ-3.1, REQ-3.2, REQ-3.3). The block is GitHub's own record. It
# is not narrated anywhere and it cannot be narrated away.
#
# The badge published on the portfolio is this workflow, not the PR gate. A
# pre-merge badge says the last pull request passed. This one says main is
# shippable now, which is the claim worth making, and it is only safe to make
# because the service under test is in this repository.

on:
  push:
    # `ci/**` is here so the whole workflow, including the promotion block, can
    # be exercised on a branch. Verification can be made to fail there
    # deliberately without touching the badge, which is pinned to `main`.
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a run in flight: a cancelled promotion would leave the record
  # of what is in production ambiguous.
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify main
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Capture is on here and off everywhere else. Every exchange the suite
      # makes is recorded with the case that made it, what that case claims to
      # cover, and whether it passed. The evidence pages are built from these
      # files, so nothing on them is authored after the fact.
      - name: Full suite
        env:
          RELEASE_GATE_EVIDENCE: reports/evidence
        run: pytest --junitxml=reports/junit.xml

      # The suite above drives the application in process. This step builds a
      # fresh instance, serves it over real HTTP on a database that did not
      # exist a moment ago, and drives it as a client would. A service that only
      # works when imported is not a service.
      - name: Smoke the freshly built instance
        run: |
          set -euo pipefail
          mkdir -p reports
          RELEASE_GATE_DB=$RUNNER_TEMP/verify.db \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > reports/service.log 2>&1 &
          echo $! > reports/service.pid
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 0.5
          done
          python -m tools.smoke http://127.0.0.1:8000
          kill "$(cat reports/service.pid)"

      - name: Export the OpenAPI document
        run: python -m tools.export_openapi reports/openapi.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn

  promote:
    name: Promote to production
    needs: verify
    # Two conditions, and they are not redundant. `needs: verify` is the release
    # gate: no promotion without a green suite (REQ-3). The ref check is the
    # blast radius: only `main` can ever be promoted, so a run on a `ci/**`
    # branch exercises verification and stops there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Promotion is the only job that writes anything outside the run. It tags a
    # release, and that tag is what "currently in production" means in a project
    # with no hosting: the newest promoted tag, and nothing else.
    permissions:
      contents: write

    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record what is being promoted
        id: version
        run: |
          set -euo pipefail
          version="v0.1.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Promoted to production"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | $version |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Verified by | run ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Promoted by run ${{ github.run_id }} after the full suite passed on ${{ github.sha }}."

  publish:
    name: Publish the evidence
    needs: [verify, promote]
    # Runs whether or not verification passed, and whether or not promotion was
    # skipped. That is the point: a dashboard that only updates on green days
    # shows a pass rate of one hundred percent and evidences nothing. When the
    # gate holds, this job is what records that it held.
    if: always() && github.ref == 'refs/heads/main' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The ledger and the published site live here and nowhere else. Keeping
      # them off main is what makes "written only by CI" structural: there is no
      # branch on which a person edits them as part of a normal change.
      - name: Check out the evidence branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No pip install. The publishing tools are standard library only, so this
      # job cannot fail on a dependency resolution and cannot be poisoned by one.
      - name: Download what the verify job produced
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verification-evidence-${{ github.run_number }}
          path: reports

      - name: Read GitHub's own record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.collect_github --out reports

      # Before anything is added to the evidence branch, check that nothing on
      # it was written by a person. A human commit does not get silently built
      # on top of. See tools/provenance.py for why this is a check rather than
      # a platform rule.
      - name: Check the evidence branch is machine written
        run: python -m tools.provenance --repository published

      - name: Record this run in the ledger
        run: |
          python -m tools.record_run \
            --junit reports/junit.xml \
            --ledger published/results/runs.csv \
            --run-number ${{ github.run_number }} \
            --run-id ${{ github.run_id }} \
            --sha ${{ github.sha }} \
            --branch ${{ github.ref_name }} \
            --result ${{ needs.verify.result == 'success' && 'pass' || 'fail' }}

      - name: Build the evidence site
        run: |
          python -m tools.build_site \
            --reports reports \
            --ledger published/results/runs.csv \
            --out published \
            --sha ${{ github.sha }} \
            --run-id ${{ github.run_id }}

      - name: Publish
        working-directory: published
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Publish evidence from run ${{ github.run_id }} on ${{ github.sha }}"
          git push
