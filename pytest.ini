[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .

# --strict-markers : a typo in a marker is an error, not a silent no-op.
# --strict-config  : a typo in this file is an error too.
#
# Nothing is deselected by default. Every layer runs on a clean clone with
# `pytest`, because the service under test is in this repository and depends on
# no third party. That is the property that makes the post-merge badge honest.
addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: rule logic, called directly. No HTTP, no database.
    contract: response bodies validated against the generated OpenAPI document.
    integration: the running application, through HTTP.
    meta: checks on this repository and on the suite itself.
    endpoint(spec): the endpoint an integration test exercises, as "METHOD /path".
